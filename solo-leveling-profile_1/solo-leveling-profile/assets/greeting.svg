    <rect width="560" height="220" rx="10" fill="url(#bgGrad)" stroke="#1c4a63"/>
    <path d="M10 24 L10 10 L24 10" stroke="#3fd4ff" stroke-width="1.6" fill="none" filter="url(#glow)"/>
